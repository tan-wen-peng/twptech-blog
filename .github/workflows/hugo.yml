name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

  # 生产环境实际由 腾讯云 COS + CDN 提供。
  # 在仓库 Settings -> Secrets 配置 COS_SECRET_ID / COS_SECRET_KEY 后，
  # 每次 push 自动构建并同步到 COS + 刷新 CDN 缓存。未配置密钥时自动跳过。
  deploy-cos:
    needs: build-deploy
    runs-on: ubuntu-latest
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: twptech-blog-1407052797
      COS_REGION: ap-guangzhou
    steps:
      - name: Check COS secrets
        env:
          HAS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "COS 密钥未配置，跳过生产部署"
            exit 78  # neutral exit: 任务标记为跳过而非失败
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload to COS
        run: |
          pip install coscmd -q
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"
          coscmd upload -r --delete ./public/ /

      - name: Purge CDN cache
        run: |
          pip install tencentcloud-sdk-python -q
          python - <<'PY'
import os
from tencentcloud.common import credential
from tencentcloud.common.profile.client_profile import ClientProfile
from tencentcloud.common.profile.http_profile import HttpProfile
from tencentcloud.common.common_client import CommonClient
cred = credential.Credential(os.environ['COS_SECRET_ID'], os.environ['COS_SECRET_KEY'])
hp = HttpProfile(endpoint='cdn.tencentcloudapi.com')
cp = ClientProfile(httpProfile=hp)
cli = CommonClient('cdn', '2018-06-06', cred, 'ap-guangzhou', profile=cp)
cli.call_json('PurgeUrlsCache', {'Urls': ['https://www.twptech.site/', 'https://www.twptech.site/index.xml', 'https://www.twptech.site/sitemap.xml', 'https://www.twptech.site/index.json']})
print('CDN 缓存刷新已提交')
PY
