<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
  <rect width="820" height="330" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="13" fill="#0f172a">
    <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="700">案例 1：转轴组件轴向间隙链　X = A1 − A2 − A3 − A4</text>
  </g>
  <!-- 零件 -->
  <g stroke="#334155" stroke-width="1.5" fill="#e2e8f0">
    <rect x="80" y="120" width="190" height="90" rx="3"/>
    <rect x="290" y="135" width="92" height="60" rx="3" fill="#cbd5e1"/>
    <rect x="398" y="132" width="120" height="66" rx="3" fill="#e2e8f0"/>
    <rect x="534" y="140" width="46" height="50" rx="3" fill="#cbd5e1"/>
  </g>
  <!-- 轴 -->
  <rect x="80" y="152" width="500" height="26" fill="#94a3b8" opacity="0.55" stroke="none"/>
  <!-- 间隙 -->
  <rect x="518" y="132" width="16" height="66" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <g font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="175" y="172">轴承座内腔</text>
    <text x="336" y="172">轴承</text>
    <text x="458" y="172">隔套</text>
    <text x="557" y="172">端盖</text>
    <text x="526" y="120" font-size="11" fill="#b45309">X 间隙</text>
  </g>
  <!-- 尺寸标注 -->
  <g stroke="#2563eb" stroke-width="1.2" fill="none">
    <line x1="80" y1="86" x2="288" y2="86"/><line x1="80" y1="80" x2="80" y2="92"/><line x1="288" y1="80" x2="288" y2="92"/>
    <line x1="290" y1="70" x2="390" y2="70"/><line x1="290" y1="64" x2="290" y2="76"/><line x1="390" y1="64" x2="390" y2="76"/>
    <line x1="398" y1="86" x2="516" y2="86"/><line x1="398" y1="80" x2="398" y2="92"/><line x1="516" y1="80" x2="516" y2="92"/>
    <line x1="534" y1="70" x2="580" y2="70"/><line x1="534" y1="64" x2="534" y2="76"/><line x1="580" y1="64" x2="580" y2="76"/>
    <line x1="518" y1="236" x2="534" y2="236"/><line x1="518" y1="230" x2="518" y2="242"/><line x1="534" y1="230" x2="534" y2="242"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#1e3a8a" text-anchor="middle">
    <text x="184" y="80">A1 40.00 +0.10/0</text>
    <text x="340" y="64">A2 12.00 0/−0.12</text>
    <text x="457" y="80">A3 22.00 ±0.05</text>
    <text x="557" y="64">A4 5.85 0/−0.05</text>
    <text x="526" y="254" font-size="11">0.15</text>
  </g>
  <!-- 增/减环 -->
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="184" y="250" fill="#15803d">增环 ↑</text>
    <text x="340" y="250" fill="#b91c1c">减环 ↓</text>
    <text x="400" y="250" fill="#b91c1c">减环 ↓</text>
    <text x="600" y="250" fill="#b91c1c">减环 ↓</text>
  </g>
  <text x="410" y="300" font-family="sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">封闭环 X 由四段轴向尺寸串联决定；轴承是标准件（公差不可改）</text>
</svg>