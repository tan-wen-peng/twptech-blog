<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260">
  <rect width="820" height="260" fill="#f8fafc"/>
  <text x="410" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">错误 1：减环上下偏差没有交叉取 —— 区间被收窄，两端都更「安全」</text>
  <!-- 轴 -->
  <line x1="90" y1="60" x2="760" y2="60" stroke="#94a3b8" stroke-width="1"/>
  <g font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="90" y="52">0</text><text x="224" y="52">0.1</text><text x="358" y="52">0.2</text><text x="492" y="52">0.3</text><text x="626" y="52">0.4</text><text x="760" y="52">0.5</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="0.8">
    <line x1="90" y1="60" x2="90" y2="210"/><line x1="224" y1="60" x2="224" y2="210"/><line x1="358" y1="60" x2="358" y2="210"/>
    <line x1="492" y1="60" x2="492" y2="210"/><line x1="626" y1="60" x2="626" y2="210"/><line x1="760" y1="60" x2="760" y2="210"/>
  </g>
  <!-- 正确 -->
  <g><rect x="224" y="90" width="497" height="34" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <text x="472" y="112" text-anchor="middle" font-family="monospace" font-size="12" fill="#14532d">正确：0.100 ~ 0.470（宽 0.370）</text></g>
  <g font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="end"><text x="212" y="112">交叉取</text></g>
  <!-- 错误 -->
  <g><rect x="358" y="150" width="228" height="34" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="472" y="172" text-anchor="middle" font-family="monospace" font-size="12" fill="#7f1d1d">错误：0.200 ~ 0.370（宽 0.170）</text></g>
  <g font-family="sans-serif" font-size="12" fill="#b91c1c" text-anchor="end"><text x="212" y="172">上减上</text></g>
  <g stroke="#b91c1c" stroke-width="1.2" fill="#b91c1c">
    <line x1="224" y1="205" x2="358" y2="205"/><line x1="358" y1="205" x2="358" y2="200"/>
  </g>
  <text x="291" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">最小间隙凭空变大 0.10 → 0.20</text>
  <text x="620" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">最大间隙被低估 0.47 → 0.37</text>
</svg>