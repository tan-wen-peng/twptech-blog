baseURL = "https://www.twptech.site/"
locale = "zh-CN"
title = "TWP技术笔记 · 机械结构 · 自动化"
theme = "PaperMod"
defaultContentLanguage = "zh"
enableInlineShortcodes = true
enableRobotsTXT = true
hasCJKLanguage = true

[params]
  description = "机械结构设计 | Creo参数化建模 | 工程图自动化 — 只讲产线上真实趟过的坑"
  author = "TWP"
  keywords = ["机械结构设计","Creo","参数化建模","Top-Down设计","工程图自动化","BOM体系","SolidWorks","Creo二次开发","NX二次开发","NXOpen","C++","Python","图纸数字化","钣金","结构仿真","工业自动化","机械工程师","结构设计"]
  DateFormat = "2006-01-02"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  mainSections = ["posts"]
  disableSpecial1stPost = false
  ShowRelatedPosts = true
  relatedPostsLimit = 5
  disableScrollToTop = false
  comments = true
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  # Fuse.js 搜索参数
  [params.fuseOpts]
    isCaseSensitive = false
    includeScore = true
    includeMatches = true
    shouldSort = true
    findAllMatches = true
    minMatchCharLength = 2
    threshold = 0.3
    distance = 200
    ignoreLocation = true
    keys = ["title", "permalink", "summary", "content"]

  [params.homeInfoParams]
    Title = "TWP技术笔记"
    Content = """
**机械结构 · 工程图自动化**

产线上踩过的坑、淌过的雷，才是工程师最值钱的资产。

本站只聊机械结构设计、Creo/NX 参数化建模、工程图与 BOM 自动化、CAD 二次开发。  
C++ / Python 为主，NXOpen 与 Pro/TOOLKIT 是核心工具。不聊前端、不写 AI 玩具、不讲 Linux 运维。
"""

