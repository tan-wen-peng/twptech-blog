    name = "github"
    title = "GitHub"
    url = "https://github.com/tan-wen-peng"

  [[params.socialIcons]]
    name = "email"
    title = "联系我"
    url = "mailto:2129336372@qq.com"

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  # editPost 暂不启用（GitHub Pages 遗留）
  #[params.editPost]
